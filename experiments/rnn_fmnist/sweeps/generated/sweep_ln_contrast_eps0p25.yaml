name: rnn-fmnist-ln-contrast-eps-0p25
project: rnn-fmnist-invariance
program: experiments/rnn_fmnist/main.py
method: bayes

metric:
  name: test/accuracy_pct
  goal: maximize

parameters:
  lr:
    distribution: log_uniform_values
    min: 0.001
    max: 0.1
  lr_ie:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.01
  lr_ei:
    distribution: log_uniform_values
    min: 0.01
    max: 1.0

command:
  - ${env}
  - ${interpreter}
  - -m
  - experiments.rnn_fmnist.main
  - --wandb
  - --normalization=ln
  - --dataset=fashionmnist_contrast
  - --epsilon=0.25
  - --momentum=0
  - ${args}
