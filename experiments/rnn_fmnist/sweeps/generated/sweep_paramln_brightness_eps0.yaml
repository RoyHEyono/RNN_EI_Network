name: rnn-fmnist-paramln-brightness-eps-0
project: rnn-fmnist-invariance
program: experiments/rnn_fmnist/main.py
method: bayes

metric:
  name: validation/joint_loss
  goal: minimize

parameters:
  lr:
    distribution: log_uniform_values
    min: 0.001
    max: 0.1
  lr_ie:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.01
  lr_ei:
    distribution: log_uniform_values
    min: 0.01
    max: 1.0
  lr_norm_mean:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.1
  lr_norm_var0:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.1

command:
  - ${env}
  - ${interpreter}
  - -m
  - experiments.rnn_fmnist.main
  - --wandb
  - --normalization=paramln
  - --dataset=fashionmnist
  - --epsilon=0
  - --momentum=0
  - ${args}
